<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="农保云 候选G 轨道苗环">
  <rect width="96" height="96" rx="21" fill="#0b1510"/>
  <!-- 环：承保闭环 / 卫星轨道 -->
  <circle id="gRing" pathLength="1" cx="48" cy="48" r="33.5" fill="none" stroke="#4be0b0" stroke-width="5"/>
  <!-- 苗 -->
  <path id="gStem" pathLength="1" d="M48 63V45" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
  <g id="gLeaves" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round">
    <path d="M47 51C42 49.5 39.5 45.5 40.5 40.5"/>
    <path d="M49 51C54 49.5 56.5 45.5 55.5 40.5"/>
  </g>
  <!-- 轨道点：遥感卫星（可绕环循环） -->
  <circle id="gDot" cx="71.7" cy="24.3" r="3.6" fill="#22d3ee"/>
</svg>
