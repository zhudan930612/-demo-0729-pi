  <path id="jOutline" pathLength="1" d="M48 10C29 21 17 38 20.5 55 23.5 69 35 80 48 86 61 80 72.5 69 75.5 55 79 38 67 21 48 10Z"
        fill="none" stroke="#4be0b0" stroke-width="5" stroke-linejoin="round"/>
