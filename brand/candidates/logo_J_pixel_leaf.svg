    <rect x="40.5" y="38.5" width="7" height="7" rx="1.8"/>
    <rect x="48.5" y="32.5" width="7" height="7" rx="1.8"/>
    <rect x="56.5" y="26.5" width="7" height="7" rx="1.8"/>
  </g>
  <!-- 数据溢出叶外：传输中 -->
  <g id="jData" fill="#22d3ee">
    <rect x="67" y="22.5" width="6" height="6" rx="1.6"/>
